name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Pull sandbox image (Linux only; runners there have Docker)
        if: runner.os == 'Linux'
        run: docker pull python:3.11-slim
      - run: python -m pytest -v
      - run: python -m agent --demo
